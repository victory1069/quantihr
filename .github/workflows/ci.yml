name: CI

on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same PR supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-and-api:
    name: shared + api — typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history, not the default shallow clone: test/schema-drift.test.ts
      # rebuilds an old schema with `git show ad3ba4e:…/ddl.sql`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same Node as the deployed API (render.yaml NODE_VERSION).
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      # Same install as render.yaml's buildCommand, so CI proves the tree the
      # deployed API actually gets. apps/mobile's typecheck is deliberately
      # not run here: it depends on expo-router's generated typed routes
      # (.expo/types, gitignored), which only exist after `expo start`.
      - name: Install
        run: npm ci --include=dev --include-workspace-root --workspace @quanti/shared --workspace @quanti/api

      - name: Typecheck
        run: npm run typecheck --workspace @quanti/shared --workspace @quanti/api

      # Same suites as `npm test`, with coverage measured on the one run.
      - name: Test
        run: npm run test:coverage --workspace @quanti/shared --workspace @quanti/api

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/shared/coverage/
            apps/api/coverage/
          if-no-files-found: ignore
          retention-days: 14
